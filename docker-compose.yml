services:
  textai-api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - ./server/.env
    environment:
      PORT: 8787
      DATABASE_PATH: /data/textai.sqlite
    volumes:
      - textai-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  textai-data:
